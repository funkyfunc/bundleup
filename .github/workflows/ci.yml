# CI (ADR-0015, ADR-0017): checks and tests on every push; the gauntlet across the platform
# matrix in docs/roadmap.md "Next up" item 2. Free on standard runners because the repo is public.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  # Every commit on main gets a full run (the fourth review found commits that never had one);
  # on other branches a newer push cancels the older run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check --output-format github .
      - run: uv run --locked pyright

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked --python 3.12
      - run: uv run --locked pytest -q tests

  gauntlet:
    name: Gauntlet (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04-arm, python: "3.11" }
          - { os: ubuntu-24.04-arm, python: "3.12" }
          - { os: windows-2025, python: "3.11" }
          - { os: windows-2025, python: "3.12" }
          - { os: macos-15, python: "3.9" } # Apple's /usr/bin/python3, the "user's Python"
          - { os: macos-15, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked --python 3.12 # installs this repo's bundleup into .venv
      - name: Install the target Python
        if: ${{ !(runner.os == 'macOS' && matrix.python == '3.9') }}
        run: uv python install ${{ matrix.python }}
      - name: Mount a noexec filesystem (Linux), for the noexec-cache condition
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,size=4g tmpfs /mnt/noexec
          sudo chmod 1777 /mnt/noexec
          echo "BUNDLEUP_GAUNTLET_NOEXEC=/mnt/noexec" >> "$GITHUB_ENV"
      - name: Run the gauntlet
        run: >
          uv run gauntlet/run_bundlers.py --tool bundleup --tool bundleup-py --conditions --check
          --python ${{ matrix.python }} --out ci
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gauntlet-${{ matrix.os }}-${{ matrix.python }}
          path: gauntlet/results/ci.json
          if-no-files-found: ignore

  # Cross-target builds (ADR-0014): build on one OS for another, run the bundles on the target.
  cross-build:
    name: Cross build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include: &cross
          - { name: macos-to-linux, build: macos-15, run: ubuntu-24.04, platform: x86_64-manylinux_2_28 }
          - { name: linux-to-windows, build: ubuntu-24.04, run: windows-2025, platform: x86_64-pc-windows-msvc }
          - { name: linux-to-macos, build: ubuntu-24.04, run: macos-15, platform: aarch64-apple-darwin }
          # Built for the Mac it ran on: pure-Python bundles must run on other OSes (ADR-0034).
          - { name: any-os-macos-to-linux, build: macos-15, run: ubuntu-24.04-arm, platform: host }
          - { name: any-os-macos-to-windows, build: macos-15, run: windows-2025, platform: host }
          # One bundle for three platforms, built on a Mac, run on each (ADR-0038).
          - { name: multi-on-linux, build: macos-15, run: ubuntu-24.04, platform: "x86_64-manylinux_2_28,x86_64-pc-windows-msvc,aarch64-apple-darwin" }
          - { name: multi-on-windows, build: macos-15, run: windows-2025, platform: "x86_64-manylinux_2_28,x86_64-pc-windows-msvc,aarch64-apple-darwin" }
          - { name: multi-on-macos, build: macos-15, run: macos-15, platform: "x86_64-manylinux_2_28,x86_64-pc-windows-msvc,aarch64-apple-darwin" }
    runs-on: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked --python 3.12
      - run: uv python install 3.11
      - run: uv run gauntlet/cross.py build --python 3.11 --python-platform ${{ matrix.platform }} --dir cross
      - uses: actions/upload-artifact@v7
        with:
          name: cross-${{ matrix.name }}
          path: cross

  cross-run:
    name: Cross run (${{ matrix.name }})
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        include: *cross
    runs-on: ${{ matrix.run }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - run: uv python install 3.11
      - uses: actions/download-artifact@v8
        with:
          name: cross-${{ matrix.name }}
          path: cross
      - name: Run the bundles built elsewhere
        run: uv run gauntlet/cross.py run --python 3.11 --dir cross --check --out cross
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cross-results-${{ matrix.name }}
          path: gauntlet/results/cross.json
          if-no-files-found: ignore

  skill:
    # The founding use case end to end (docs/recipes.md, fifth review): a skill's scripts share
    # one deps.pyz built on a Mac with --entry python for four platforms; each OS runs them, a
    # sibling started with sys.executable included, and pywin32 on Windows.
    name: Skill recipe (build)
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - name: Build deps.pyz for macOS arm64 and x86_64, Windows and Linux
        run: >
          uv run bundleup build gauntlet/skill --entry python --python 3.12 --strict
          --python-platform aarch64-apple-darwin --python-platform x86_64-apple-darwin
          --python-platform x86_64-pc-windows-msvc --python-platform x86_64-manylinux_2_28
          -o skill/deps.pyz
      - name: The same, split into files of at most 20 MB (--split, ADR-0045)
        run: >
          uv run bundleup build gauntlet/skill --entry python --python 3.12 --strict
          --python-platform aarch64-apple-darwin --python-platform x86_64-apple-darwin
          --python-platform x86_64-pc-windows-msvc --python-platform x86_64-manylinux_2_28
          --split 20MB -o skill/split/deps.pyz
          && test -d skill/split/deps.pyz.parts
          && test -z "$(find skill/split -type f -size +20000000c)"
      - name: The same as executables with their own Python (--format exe, ADR-0047)
        run: |
          build="uv run bundleup build gauntlet/skill --entry python --python 3.12 --strict --format exe"
          $build --python-platform aarch64-apple-darwin -o skill/exe/macos/skill
          $build --python-platform x86_64-manylinux_2_28 -o skill/exe/linux/skill
          $build --python-platform x86_64-pc-windows-msvc -o skill/exe/windows/skill.exe
      - name: Builds are reproducible (seventh review)
        run: |
          uv run bundleup build gauntlet/skill --entry python --python 3.12 --python-platform aarch64-apple-darwin --python-platform x86_64-pc-windows-msvc --split 20MB -o again/split/deps.pyz -q
          uv run bundleup build gauntlet/skill --entry python --python 3.12 --format exe --python-platform aarch64-apple-darwin -o again/skill -q
          uv run bundleup build gauntlet/skill --entry python --python 3.12 --python-platform aarch64-apple-darwin --python-platform x86_64-pc-windows-msvc --split 20MB -o again/split2/deps.pyz -q
          diff -r again/split again/split2 && cmp again/skill skill/exe/macos/skill
      - uses: actions/upload-artifact@v7
        with:
          name: skill
          path: skill

  skill-run:
    name: Skill recipe (${{ matrix.os }})
    needs: skill
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install 3.12
      - uses: actions/download-artifact@v8
        with:
          name: skill
          path: skill
      - name: Run the skill's scripts through the bundle
        shell: bash
        run: |
          py=$(uv python find 3.12)
          out=$("$py" skill/deps.pyz gauntlet/skill/scripts/make_deck.py a); echo "$out"
          [[ "$out" == "SKILL OK ['a'] True"* ]]
          out=$("$py" skill/deps.pyz gauntlet/skill/scripts/run_sibling.py); echo "$out"
          [[ "$out" == "SKILL OK ['from-sibling'] True"* ]]
          if [ "$RUNNER_OS" = Windows ]; then [[ "$out" == *"win32api True"* ]]; fi
          out=$("$py" skill/split/deps.pyz gauntlet/skill/scripts/make_deck.py b); echo "$out"
          [[ "$out" == "SKILL OK ['b'] True"* ]]
      - name: Run the executable with no Python on PATH
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) exe=skill/exe/linux/skill ;;
            macOS) exe=skill/exe/macos/skill ;;
            Windows) exe=skill/exe/windows/skill.exe ;;
          esac
          chmod +x "$exe"  # artifacts don't keep the executable bit
          out=$(PATH=/nonexistent "$exe" gauntlet/skill/scripts/make_deck.py c); echo "$out"
          [[ "$out" == "SKILL OK ['c'] True"* ]]
          out=$(PATH=/nonexistent "$exe" gauntlet/skill/scripts/run_sibling.py); echo "$out"
          [[ "$out" == "SKILL OK ['from-sibling'] True"* ]]
          if [ "$RUNNER_OS" = Windows ]; then [[ "$out" == *"win32api True"* ]]; fi

  docker:
    # The Docker recipe (docs/recipes.md): a native bundle copied onto python:3.12-slim runs as is,
    # in a read-only container with an executable /tmp, and refuses clearly with Docker's default
    # --tmpfs, which is noexec (rounds 6 and 7: noexec /tmp broke pex scies in hardened pods).
    name: Docker recipe
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - name: Build a native bundle for Linux x86_64
        run: >
          uv run bundleup build gauntlet/projects/12-native-per-version --entry g12_perversion:main
          --python 3.12 --python-platform x86_64-manylinux_2_28 -o docker/app.pyz
      - name: Build the image
        run: |
          printf 'FROM python:3.12-slim\nCOPY app.pyz /app/app.pyz\nENTRYPOINT ["python", "/app/app.pyz"]\n' > docker/Dockerfile
          docker build -t bundleup-recipe docker
      - name: Run it, read-only with an executable /tmp, and with a noexec /tmp
        run: |
          docker run --rm bundleup-recipe | tee plain.txt; grep -q "GAUNTLET OK" plain.txt
          docker run --rm --read-only --tmpfs /tmp:exec bundleup-recipe | tee ro.txt; grep -q "GAUNTLET OK" ro.txt
          if docker run --rm --read-only --tmpfs /tmp bundleup-recipe 2> noexec.txt; then
            echo "expected a refusal: every writable folder is noexec"; exit 1
          fi
          cat noexec.txt; grep -q "mounted noexec" noexec.txt

  formats:
    # ADR-0025: the `dir` output run as a host application would (only PYTHONPATH), and the Lambda
    # .zip invoked in AWS's own Lambda image (public.ecr.aws/lambda/python) through its runtime
    # interface emulator: read-only /var/task, Amazon Linux 2023's glibc.
    name: Formats (${{ matrix.format }}, ${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: dir, os: ubuntu-24.04, args: "" }
          - { format: dir, os: windows-2025, args: "" }
          - { format: dir, os: macos-15, args: "" }
          - { format: lambda, os: ubuntu-24.04, args: "" }
          - { format: lambda, os: ubuntu-24.04-arm, args: "--platform aarch64-manylinux_2_34" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - run: uv python install 3.12 3.13
      - run: uv run gauntlet/formats.py ${{ matrix.format }} ${{ matrix.args }} --check --out formats
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: formats-${{ matrix.format }}-${{ matrix.os }}
          path: gauntlet/results/formats.json
          if-no-files-found: ignore

  recipes:
    # Each recipe in docs/recipes.md must build the founding example (python-pptx, lxml, Pillow:
    # compiled wheels) from a Mac and from Linux (ADR-0039). The independent review of 2026-10-07
    # found the Claude API settings couldn't.
    name: Recipes (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - run: uv python install 3.11 3.13
      - name: Build gauntlet 14 with every recipe
        shell: bash
        run: |
          build() { uv run bundleup build gauntlet/projects/14-real-world-pptx --entry g14_pptx:main "$@"; }
          build --against docs/targets/claude-api.toml -o recipes/claude-api.pyz
          build --against docs/targets/aws-lambda-python3.13-x86_64.toml -o recipes/lambda.zip
          build --against docs/targets/aws-lambda-python3.13-arm64.toml -o recipes/lambda-arm64.zip
