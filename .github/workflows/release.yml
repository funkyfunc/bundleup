# Publish to PyPI when a version tag (v0.1.0) is pushed (docs/releasing.md). Uses PyPI trusted
# publishing: no token is stored here; the owner registers this workflow on pypi.org once. Runs
# only bundleup's own code.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: The tag matches the version
        run: |
          version=$(uv run --frozen python -c "import bundleup; print(bundleup.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # trusted publishing
      contents: write # GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv publish --trusted-publishing always
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c '
          import os, re, subprocess
          from pathlib import Path
          tag = os.environ["GITHUB_REF_NAME"]
          ver = re.escape(tag.removeprefix("v"))
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"(?ms)^## {ver} \([^\n]+\)\n+(.*?)(?=^## |\Z)", text)
          notes = m.group(1).strip() if m else f"Release {tag}"
          dists = [str(p) for p in sorted(Path("dist").glob("*")) if p.is_file()]
          subprocess.run(["gh", "release", "create", tag, *dists, "--title", tag, "--notes", notes], check=True)
          '
