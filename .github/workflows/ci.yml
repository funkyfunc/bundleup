# CI (ADR-0015, ADR-0017): checks and tests on every push; the gauntlet across the platform
# matrix in docs/roadmap.md "Next up" item 2. Free on standard runners because the repo is public.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check --output-format github .
      - run: uv run --locked pyright

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked --python 3.12
      - run: uv run --locked pytest -q tests

  gauntlet:
    name: Gauntlet (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04-arm, python: "3.11" }
          - { os: ubuntu-24.04-arm, python: "3.12" }
          - { os: windows-2025, python: "3.11" }
          - { os: windows-2025, python: "3.12" }
          - { os: macos-15, python: "3.9" } # Apple's /usr/bin/python3, the "user's Python"
          - { os: macos-15, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked --python 3.12 # installs this repo's bundleup into .venv
      - name: Install the target Python
        if: ${{ !(runner.os == 'macOS' && matrix.python == '3.9') }}
        run: uv python install ${{ matrix.python }}
      - name: Run the gauntlet
        run: >
          uv run gauntlet/run_bundlers.py --tool bundleup --conditions --check
          --python ${{ matrix.python }} --out ci
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gauntlet-${{ matrix.os }}-${{ matrix.python }}
          path: gauntlet/results/ci.json
          if-no-files-found: ignore

  # Cross-target builds (ADR-0014): build on one OS for another, run the bundles on the target.
  cross-build:
    name: Cross build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include: &cross
          - { name: macos-to-linux, build: macos-15, run: ubuntu-24.04, platform: x86_64-manylinux_2_28 }
          - { name: linux-to-windows, build: ubuntu-24.04, run: windows-2025, platform: x86_64-pc-windows-msvc }
          - { name: linux-to-macos, build: ubuntu-24.04, run: macos-15, platform: aarch64-apple-darwin }
    runs-on: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked --python 3.12
      - run: uv python install 3.11
      - run: uv run gauntlet/cross.py build --python 3.11 --python-platform ${{ matrix.platform }} --dir cross
      - uses: actions/upload-artifact@v7
        with:
          name: cross-${{ matrix.name }}
          path: cross

  cross-run:
    name: Cross run (${{ matrix.name }})
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        include: *cross
    runs-on: ${{ matrix.run }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - run: uv python install 3.11
      - uses: actions/download-artifact@v8
        with:
          name: cross-${{ matrix.name }}
          path: cross
      - name: Run the bundles built elsewhere
        run: uv run gauntlet/cross.py run --python 3.11 --dir cross --check --out cross
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cross-results-${{ matrix.name }}
          path: gauntlet/results/cross.json
          if-no-files-found: ignore
