# AWS Lambda, Python 3.13 runtime on arm64 (ADR-0044, ADR-0049). Python 3.12+ runs on Amazon Linux
# 2023 (glibc 2.34); direct zip uploads are capped at 50 MB.
# Use: bundleup build --against docs/targets/aws-lambda-python3.13-arm64.toml --entry app:handler
name = "AWS Lambda, python3.13, arm64"
source = "https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html"
checked = "2026-10-06"
format = "zip"
python = "3.13"
python-platform = "aarch64-manylinux_2_34"
max-size = "50MB"
network = true
installs = false
