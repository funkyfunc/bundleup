[project]
name = "bundleup"
version = "0.0.1"
description = "Bundle up your Python app with everything it needs: one .pyz that runs on plain Python, no install step. Pre-alpha."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "funkyfunc" }]
keywords = ["bundler", "pyz", "zipapp", "packaging", "distribution", "cli"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "packaging>=23",
    "tomli>=1.1; python_version < '3.11'",
    "uv>=0.9",
]

[project.urls]
Homepage = "https://github.com/funkyfunc/bundleup"
Repository = "https://github.com/funkyfunc/bundleup"
Issues = "https://github.com/funkyfunc/bundleup/issues"

[project.scripts]
bundleup = "bundleup._cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.25.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.4.2",
    "ruff>=0.16.10",
    "tomli>=2.4.1",
]

# Code quality (ADR-0015). Rule choices are Proposed until the user confirms them.
[tool.ruff]
line-length = 100
target-version = "py39"  # the loader must run on macOS's system Python 3.9
extend-exclude = ["gauntlet/projects", "docs"]  # fixtures (17 uses 3.12-only syntax on purpose)
force-exclude = true  # also when a hook passes an excluded file explicitly
# Harness scripts need tomllib; snapshot.py runs on the target Python, so it stays 3.9.
per-file-target-version = { "gauntlet/*.py" = "py311", "gauntlet/snapshot.py" = "py39" }

[tool.ruff.lint]
# ANN enforces "type hints on every function signature" (docs/python-for-js-reviewers.md).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
allowed-confusables = ["–"]  # the en dash reports use for "not applicable"

[tool.ruff.lint.per-file-ignores]
# The loader prints its "wrong Python" message on any Python 3, so it avoids f-strings and other
# newer syntax on purpose.
"src/bundleup/_loader.py" = ["UP004", "UP031", "UP032"]

[tool.pyright]
include = ["src", "tests", "gauntlet/*.py"]
exclude = ["gauntlet/projects", "gauntlet/.work"]  # fixtures, even when a path is passed explicitly
pythonVersion = "3.9"
typeCheckingMode = "standard"
executionEnvironments = [
    { root = "gauntlet/snapshot.py", pythonVersion = "3.9" },
    { root = "gauntlet", pythonVersion = "3.11" },
    { root = "src" },
    { root = "tests" },
]
