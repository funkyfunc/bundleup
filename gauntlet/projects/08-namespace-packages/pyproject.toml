[project]
name = "g08-app"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["acme-core", "acme-extras"]

[project.scripts]
g08 = "g08_app:main"

[tool.uv.sources]
acme-core = { workspace = true }
acme-extras = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
