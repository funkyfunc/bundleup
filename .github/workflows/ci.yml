# CI (ADR-0015, ADR-0017): checks and tests on every push; the gauntlet across the platform
# matrix in docs/roadmap.md "Next up" item 2. Free on standard runners because the repo is public.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check --output-format github .
      - run: uv run --locked pyright

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked --python 3.12
      - run: uv run --locked pytest -q tests

  gauntlet:
    name: Gauntlet (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04-arm, python: "3.11" }
          - { os: ubuntu-24.04-arm, python: "3.12" }
          - { os: windows-2025, python: "3.11" }
          - { os: windows-2025, python: "3.12" }
          - { os: macos-15, python: "3.9" } # Apple's /usr/bin/python3, the "user's Python"
          - { os: macos-15, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked --python 3.12 # installs this repo's bundleup into .venv
      - name: Install the target Python
        if: ${{ !(runner.os == 'macOS' && matrix.python == '3.9') }}
        run: uv python install ${{ matrix.python }}
      - name: Run the gauntlet
        run: >
          uv run gauntlet/run_bundlers.py --tool bundleup --conditions --check
          --python ${{ matrix.python }} --out ci
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gauntlet-${{ matrix.os }}-${{ matrix.python }}
          path: gauntlet/results/ci.json
          if-no-files-found: ignore

  # Cross-target builds (ADR-0014): build on one OS for another, run the bundles on the target.
  cross-build:
    name: Cross build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include: &cross
          - { name: macos-to-linux, build: macos-15, run: ubuntu-24.04, platform: x86_64-manylinux_2_28 }
          - { name: linux-to-windows, build: ubuntu-24.04, run: windows-2025, platform: x86_64-pc-windows-msvc }
          - { name: linux-to-macos, build: ubuntu-24.04, run: macos-15, platform: aarch64-apple-darwin }
          # Built for the Mac it ran on: pure-Python bundles must run on other OSes (ADR-0034).
          - { name: any-os-macos-to-linux, build: macos-15, run: ubuntu-24.04-arm, platform: host }
          - { name: any-os-macos-to-windows, build: macos-15, run: windows-2025, platform: host }
    runs-on: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # publishes exact versions only, no floating v10 tag
      - run: uv sync --locked --python 3.12
      - run: uv python install 3.11
      - run: uv run gauntlet/cross.py build --python 3.11 --python-platform ${{ matrix.platform }} --dir cross
      - uses: actions/upload-artifact@v7
        with:
          name: cross-${{ matrix.name }}
          path: cross

  cross-run:
    name: Cross run (${{ matrix.name }})
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        include: *cross
    runs-on: ${{ matrix.run }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - run: uv python install 3.11
      - uses: actions/download-artifact@v8
        with:
          name: cross-${{ matrix.name }}
          path: cross
      - name: Run the bundles built elsewhere
        run: uv run gauntlet/cross.py run --python 3.11 --dir cross --check --out cross
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cross-results-${{ matrix.name }}
          path: gauntlet/results/cross.json
          if-no-files-found: ignore

  formats:
    # ADR-0025: the `dir` output run as a host application would (only PYTHONPATH), and the Lambda
    # .zip invoked in AWS's own Lambda image (public.ecr.aws/lambda/python) through its runtime
    # interface emulator: read-only /var/task, Amazon Linux 2023's glibc.
    name: Formats (${{ matrix.format }}, ${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: dir, os: ubuntu-24.04, args: "" }
          - { format: dir, os: windows-2025, args: "" }
          - { format: dir, os: macos-15, args: "" }
          - { format: lambda, os: ubuntu-24.04, args: "--target lambda" }
          - { format: lambda, os: ubuntu-24.04-arm, args: "--target lambda-arm64" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - run: uv python install 3.12 3.13
      - run: uv run gauntlet/formats.py ${{ matrix.format }} ${{ matrix.args }} --check --out formats
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: formats-${{ matrix.format }}-${{ matrix.os }}
          path: gauntlet/results/formats.json
          if-no-files-found: ignore

  presets:
    # Every target preset must build the founding example (python-pptx, lxml, Pillow: compiled
    # wheels) from a Mac and from Linux. The independent review of 2026-10-07 found claude-api
    # couldn't.
    name: Presets (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - run: uv python install 3.11 3.13
      - name: Build gauntlet 14 with every preset
        shell: bash
        run: |
          for target in $(uv run bundleup targets --json | jq -r '.result.targets[].name'); do
            uv run bundleup build gauntlet/projects/14-real-world-pptx --target "$target" \
              --entry g14_pptx:main -o "presets/g14-$target" || exit 1
          done
