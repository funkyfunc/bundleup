# Real programs bundleup is tested on every night (roadmap item 6, ADR-0017; runner: corpus.py).
#
# Every entry is pinned, so a failure can be reproduced. Each command is run both installed
# normally (`uv sync`) and from the bundle; exit codes and output must match.
#
# [[app]]   a CLI from PyPI, wrapped in a throwaway locked project that depends on `requirement`.
#           `command` is its console script; `entry` overrides it for apps without one.
# [[repo]]  a public, clearly licensed GitHub project with pyproject.toml + uv.lock and a CLI,
#           cloned at `commit`.
#
# Pins resolved 2026-10-05 for Python 3.12.

[[app]]
requirement = "httpie==3.2.4"
command = "http"
runs = [["--version"], ["--help"]]

