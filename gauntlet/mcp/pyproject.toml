[project]
# An MCP server shipped as one .pyz (docs/recipes.md, "An MCP server"): the official SDK, with
# pydantic's compiled core, bundled for macOS, Windows and Linux. CI builds it on macOS and
# speaks MCP to it on each OS (jobs mcp, mcp-run; gauntlet/mcp/handshake.py).
name = "mcp-fixture"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=2"]

[project.scripts]
mcp-fixture = "mcp_fixture:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
