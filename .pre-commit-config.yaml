# Git hooks (ADR-0015). Install once per clone with either tool:
#   uvx pre-commit install
#   uvx prek install
# Hooks run the project's own pinned tools through `uv run`, so they match CI exactly.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: pyright
        name: pyright
        entry: uv run --frozen pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit]
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
